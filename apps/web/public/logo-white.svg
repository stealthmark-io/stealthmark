<svg viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sm-human-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="sm-agent-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sm-text-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Icon (Scale and positioned on the left) -->
  <g transform="translate(10, 10) scale(0.5)">
    <rect width="120" height="120" rx="26" fill="#0A0D14" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <!-- Human Portal Blade (Left) -->
    <path d="M 32,22 L 54,12 L 54,80 L 32,94 Z" fill="url(#sm-human-gate)" fill-opacity="0.95" />
    <path d="M 32,22 L 54,12 L 40,36 L 22,44 Z" fill="#A5B4FC" fill-opacity="0.8" />
    <!-- Agent Portal Blade (Right) -->
    <path d="M 88,98 L 66,108 L 66,40 L 88,26 Z" fill="url(#sm-agent-gate)" fill-opacity="0.95" />
    <path d="M 88,98 L 66,108 L 80,84 L 98,76 Z" fill="#6EE7B7" fill-opacity="0.8" />
    <!-- Center Cryptographic Hexagon Node -->
    <polygon points="60,48 70,54 70,66 60,72 50,66 50,54" fill="#0A0D14" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="60" cy="60" r="4" fill="#00D2FE" />
  </g>

  <!-- Wordmark "StealthMark" -->
  <text x="82" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">
    Stealth<tspan fill="url(#sm-text-accent)">Mark</tspan>
  </text>
  <text x="83" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1.5" fill="#94A3B8">
    AGENTIC INTERFACE LAYER
  </text>
</svg>
