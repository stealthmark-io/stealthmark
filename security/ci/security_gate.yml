name: Security Gate & DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast_and_audit:
    name: SAST, Dependency Audit & Perimeter Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Node.js Dependency Audit (npm audit)
        run: |
          npm audit --audit-level=high || echo "::warning::High or critical npm vulnerabilities detected"

      - name: Setup Python Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install DevSecOps Tools (pip-audit & Semgrep)
        run: |
          python -m pip install --upgrade pip
          pip install semgrep pip-audit httpx

      - name: Python Dependency Audit (pip-audit)
        run: |
          pip-audit -r infrastructure/gateway-lab/requirements.txt || echo "::warning::pip-audit identified dependency warnings"

      - name: Run SAST Rules (Semgrep)
        run: |
          semgrep --config=security/rules/sast_rules.yml --error --severity=ERROR . || echo "::warning::Semgrep reported rule matches"

      - name: Run Perimeter Hygiene & Defensive Audit Runner
        run: |
          python security/audit_runner.py --skip-boundary --policy security/rules/headers_policy.json || true

      - name: Upload Security Audit Artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: devsecops-security-report
          path: security/reports/
