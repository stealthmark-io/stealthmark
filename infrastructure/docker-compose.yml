services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stealthmark-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stealthmark
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: stealthmark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stealthmark -d stealthmark"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stealthmark-net

  redis:
    image: redis:7-alpine
    container_name: stealthmark-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stealthmark-net

  scraping-engine:
    build:
      context: ../apps/scraping-engine
      dockerfile: Dockerfile
    container_name: stealthmark-scraping-engine
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - stealthmark-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: stealthmark-api
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraping-engine:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://stealthmark:dev_password@postgres:5432/stealthmark
      REDIS_URL: redis://redis:6379
      SCRAPLING_SERVICE_URL: http://scraping-engine:8001
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SKIP_DNS_VERIFICATION: "true"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - stealthmark-net

volumes:
  pgdata:
  redisdata:

networks:
  stealthmark-net:
    driver: bridge
