steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/stealthmark-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/stealthmark-api:latest'
options:
  logging: CLOUD_LOGGING_ONLY
