name: Security CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (lockfiles & Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Trivy dependency scan (blocking CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy dependency scan (advisory HIGH)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Dockerfile misconfiguration scan (CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'

  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          version: '3.100.0@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b'
          extra_args: --only-verified

  semgrep-ce:
    name: Semgrep CE (pinned container digest, OSS rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Semgrep CE (read-only mount, metrics off)
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/src:ro"
          -w /src
          semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
          semgrep scan
          --config p/typescript
          --config p/nextjs
          --config p/python
          --config p/owasp-top-ten
          --severity ERROR
          --error
          --metrics=off
          apps packages infrastructure/gateway-lab/gateway

  oxlint-landmines-pilot:
    name: Oxlint + @interfere/landmines (network-isolated warn pilot)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install & integrity-verify pinned oxlint and @interfere/landmines (--ignore-scripts)
        env:
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/oxlint-pilot
          cd /tmp/oxlint-pilot
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund oxlint@1.94.0 @interfere/landmines@0.1.1
          node -e '
            const lock = require("/tmp/oxlint-pilot/package-lock.json").packages || {};
            const expected = {
              "node_modules/oxlint": "sha512-Fnt+3wSKRhtLmvgRfxgRX0excSPCoyiXRol4eWKZLtXxWMQtwQ3KjKQUYXOw5loyinfnZfGzh4RCYf7opfL0vw==",
              "node_modules/@interfere/landmines": "sha512-ClZhJIIMJaibCU11dQru3APhnHtzrfSRFbAfUhisusA/6ueURr1FRjJeu0i1n0Y0lGMwPNTqv9GNspJ23N9/hg=="
            };
            for (const [pkg, hash] of Object.entries(expected)) {
              const got = lock[pkg]?.integrity;
              if (got !== hash) {
                console.error(`Integrity mismatch for ${pkg}: expected ${hash}, got ${got}`);
                process.exit(1);
              }
            }
            console.log("SRI SHA-512 integrity verified for oxlint@1.94.0 and @interfere/landmines@0.1.1");
          '
          cat <<'EOF' > /tmp/oxlint-pilot/.oxlintrc.pilot.json
          {
            "categories": {
              "correctness": "off"
            },
            "jsPlugins": [
              { "name": "landmines-testing", "specifier": "@interfere/landmines/testing" }
            ],
            "overrides": [
              {
                "files": ["**/*.test.ts", "**/*.test.tsx", "**/__tests__/**/*.ts", "**/__tests__/**/*.tsx"],
                "rules": {
                  "landmines-testing/no-fixed-sleep": "warn",
                  "landmines-testing/no-flake-masking": "warn",
                  "landmines-testing/no-unsignaled-poll": "warn"
                }
              }
            ]
          }
          EOF

      - name: Run Oxlint + landmines in network-disabled read-only container
        env:
          GITHUB_TOKEN: ''
        run: >-
          docker run --rm --network=none
          -v "${{ github.workspace }}:/work:ro"
          -v "/tmp/oxlint-pilot:/pilot:ro"
          -w /work
          node@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
          /pilot/node_modules/.bin/oxlint -c /pilot/.oxlintrc.pilot.json apps packages
