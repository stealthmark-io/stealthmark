name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/next/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/next/**'
      - '.github/workflows/sdk-ci.yml'

jobs:
  test-and-build:
    name: Build & Test SDKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @stealthmark/core
        run: npm run build --workspace=@stealthmark/core

      - name: Test @stealthmark/core
        run: npm test --workspace=@stealthmark/core

      - name: Typecheck @stealthmark/core
        run: npm run typecheck --workspace=@stealthmark/core

      - name: Build @stealthmark/next
        run: npm run build --workspace=@stealthmark/next

      - name: Test @stealthmark/next
        run: npm test --workspace=@stealthmark/next

      - name: Typecheck @stealthmark/next
        run: npm run typecheck --workspace=@stealthmark/next
