name: Deploy API
on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx turbo run typecheck test --filter=@stealthmark/api...
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require GCP deployment credentials
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured. The API was NOT deployed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: stealthmark-prod

      - name: Build image
        run: |
          gcloud builds submit \
            --project stealthmark-prod \
            --config infrastructure/cloudbuild-api.yaml .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy stealthmark-api \
            --project stealthmark-prod \
            --region us-central1 \
            --image us-central1-docker.pkg.dev/stealthmark-prod/cloud-run-source-deploy/stealthmark-api:latest \
            --update-env-vars NODE_ENV=production,LOG_LEVEL=info \
            --update-secrets DATABASE_URL=STEALTHMARK_DATABASE_URL:latest,INTERNAL_AUTH_SECRET=INTERNAL_AUTH_SECRET:latest,PASSPORT_PRIVATE_KEY=PASSPORT_PRIVATE_KEY:latest,PASSPORT_PUBLIC_KEY=PASSPORT_PUBLIC_KEY:latest \
            --min-instances 1 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --allow-unauthenticated

      - name: Smoke check /health
        run: |
          url="$(gcloud run services describe stealthmark-api --project stealthmark-prod --region us-central1 --format='value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${url}/health"
